name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  vsix:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build
      - name: Package vsix
        # vsce 自动执行 vscode:prepublish（esbuild bundle + prepackage 拷贝 webview/mobile/assets 产物）
        run: npm run package:vsix --workspace=dionysus-vscode
      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: dionysus-vsix
          path: release/*.vsix
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: typescript
    # CI 环境 GUI 受限（@vscode/test-electron 需下载并启动 VS Code），允许失败不阻塞合入
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run extension host integration tests
        run: xvfb-run -a npm run test:e2e --workspace=dionysus-vscode
